# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Black Duck Security Action allows you to integrate Static Analysis Security Testing (SAST) and Software Composition Analysis (SCA) into your CI/CD pipelines.
# For more information about configuring your workflow,
# read our documentation at https://github.com/blackduck-inc/black-duck-security-scan

name: CI Black Duck security scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * 5'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      actions: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Black Duck scan config check
        if: ${{ vars.BLACKDUCKSCA_URL == '' && vars.COVERITY_URL == '' && vars.POLARIS_SERVER_URL == '' && vars.SRM_URL == '' }}
        run: |
          echo "No Black Duck scan configuration was found in repository variables."
          echo "Set at least one of: BLACKDUCKSCA_URL, COVERITY_URL, POLARIS_SERVER_URL, SRM_URL."
          echo "Skipping the Black Duck security scan for this run."

      - name: Black Duck SCA scan
        if: ${{ vars.BLACKDUCKSCA_URL != '' && secrets.BLACKDUCKSCA_TOKEN != '' }}
        uses: blackduck-inc/black-duck-security-scan@805cbd09e806b01907bbea0f990723c2bb85abe9
        with:
          blackducksca_url: ${{ vars.BLACKDUCKSCA_URL }}
          blackducksca_token: ${{ secrets.BLACKDUCKSCA_TOKEN }}

      - name: Black Duck Coverity scan
        if: ${{ vars.COVERITY_URL != '' && secrets.COVERITY_USER != '' && secrets.COVERITY_PASSPHRASE != '' }}
        uses: blackduck-inc/black-duck-security-scan@805cbd09e806b01907bbea0f990723c2bb85abe9
        with:
          coverity_url: ${{ vars.COVERITY_URL }}
          coverity_user: ${{ secrets.COVERITY_USER }}
          coverity_passphrase: ${{ secrets.COVERITY_PASSPHRASE }}

      - name: Black Duck Polaris scan
        if: ${{ vars.POLARIS_SERVER_URL != '' && secrets.POLARIS_ACCESS_TOKEN != '' }}
        uses: blackduck-inc/black-duck-security-scan@805cbd09e806b01907bbea0f990723c2bb85abe9
        with:
          polaris_server_url: ${{ vars.POLARIS_SERVER_URL }}
          polaris_access_token: ${{ secrets.POLARIS_ACCESS_TOKEN }}
          polaris_assessment_types: "SCA,SAST"

      - name: Black Duck SRM scan
        if: ${{ vars.SRM_URL != '' && secrets.SRM_API_KEY != '' }}
        uses: blackduck-inc/black-duck-security-scan@805cbd09e806b01907bbea0f990723c2bb85abe9
        with:
          srm_url: ${{ vars.SRM_URL }}
          srm_apikey: ${{ secrets.SRM_API_KEY }}
          srm_assessment_types: "SCA,SAST"
